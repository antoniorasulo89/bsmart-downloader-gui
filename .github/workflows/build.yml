name: Folio native packages

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/folio-native-build-*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tk and virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and audit dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-build.txt
          python -m pip check
          python -m pip_audit
      - name: Offline regressions (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python test_all.py
          xvfb-run -a python test_security.py
      - name: Offline regressions (Windows/macOS)
        if: runner.os != 'Linux'
        run: |
          python test_all.py
          python test_security.py
      - name: Compile, smoke test and package
        run: python scripts/package_ci.py ${{ matrix.platform }}
      - name: Upload native ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Folio-${{ matrix.platform }}
          path: |
            packages/Folio-${{ matrix.platform }}.zip
            packages/Folio-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
